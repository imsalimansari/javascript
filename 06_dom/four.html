<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom</title>
</head>
<body style="background-color: #212121; color: #fff ">
    <ul class="language">
        <li>javaScript</li>
    </ul>
</body>
<script>
    function addLang(langName) {
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addLang("Python")
    addLang("TypeScript")


    function addOptimiseLang(langName) {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOptimiseLang("PHP")
    addOptimiseLang("Golang")

    //Edit

    const editLang = document.querySelector("li:nth-child(2)");
    // editLang.innerHTML = "NewLang"
    // editLang.innerText = "NewLang"
    // editLang.textContent = "NewLang"
    
    const newli = document.createElement('li')
    newli.textContent = "NewLang"
    // editLang.replaceWith(newli)

    const editLang1 = document.querySelector("li:first-child");
    editLang1.outerHTML = '<li>ReactJs</li>'

    //remove

    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()


</script>
</html>
